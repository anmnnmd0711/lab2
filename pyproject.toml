[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "higgs-voice-studio"
version = "0.1.0"
description = "Desktop batch voice-cloning app for Higgs TTS 3"
requires-python = ">=3.10,<3.13"
dependencies = [
  "PySide6>=6.8",
  "transformers>=5.5.0",
  "accelerate>=1.6",
  "huggingface-hub>=0.30",
  "safetensors>=0.5",
  "soundfile>=0.13",
  "numpy>=1.26",
  "pydub>=0.25",
  "sentencepiece>=0.2",
]

[project.scripts]
higgs-voice-studio = "higgs_voice_studio.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
